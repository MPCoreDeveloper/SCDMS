name: Docker

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Compute image tag from git tag
      id: meta
      run: |
        # GHCR repository names must be lowercase; ${GITHUB_REPOSITORY,,} lowercases it.
        image_name="${GITHUB_REPOSITORY,,}"
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="${GITHUB_SHA:0:7}"
        fi
        tags=("ghcr.io/${image_name}:v${version}")
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          tags+=("ghcr.io/${image_name}:latest")
        fi
        echo "Version: ${version}"
        echo "Tags: ${tags[*]}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tags=$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        platforms: linux/amd64, linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.title=SCDMS
          org.opencontainers.image.description=SCDMS - Sharp Core Database Management System (web studio)
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
